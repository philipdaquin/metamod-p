name: Build Metamod-P WASM

on:
  push:
    branches: [wasm-build]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: philipdaquin/metamod-p
          ref: wasm-build

      - name: Build WASM
        env:
          EMSDK: /emsdk
        run: |
          export PATH="/emsdk/upstream/emscripten:/emsdk/node/22.16.0_64bit/bin:$PATH"
          echo "PATH=$PATH"
          which emcc
          make clean || true
          make XASH3D=1 TARGET=wasm32

      - name: Verify output
        run: |
          find . -name "*.wasm" -type f 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metamod_emscripten_wasm32.wasm
          path: |
            **/*.wasm